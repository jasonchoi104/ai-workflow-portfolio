<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F7F7F4"/>
  <rect x="72" y="58" width="1456" height="784" rx="28" fill="#FFFFFF" stroke="#D8D8D2" stroke-width="2"/>
  <text x="120" y="132" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#202124">Document → Decision</text>
  <text x="120" y="176" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5F6368">Turn scattered documents into a decision-ready state — without giving AI the final decision.</text>
  <rect x="120" y="222" width="1360" height="52" rx="12" fill="#FFF4CC"/>
  <text x="145" y="256" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#5F4B00">SYNTHETIC DEMONSTRATION — NOT A PAID CLIENT DEPLOYMENT</text>
  <text x="120" y="342" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5F6368">BEFORE</text>
  <rect x="120" y="370" width="350" height="238" rx="22" fill="#F1F3F4"/>
  <text x="154" y="420" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#202124">Scattered input</text>
  <text x="154" y="470" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#3C4043">PDFs · emails · forms</text>
  <text x="154" y="510" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#3C4043">spreadsheets · notes</text>
  <text x="154" y="565" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#7A3E00">Repeated reading • missing facts</text>
  <text x="154" y="594" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#7A3E00">conflicts discovered late</text>
  <text x="565" y="342" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5F6368">WORKFLOW</text>
  <rect x="565" y="370" width="470" height="238" rx="22" fill="#EAF2FF"/>
  <text x="600" y="420" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#174EA6">Capture → Structure → Check</text>
  <text x="600" y="468" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#3C4043">1. Extract facts + sources</text>
  <text x="600" y="506" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#3C4043">2. Flag missing / conflicting items</text>
  <text x="600" y="544" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#3C4043">3. Build a concise decision packet</text>
  <rect x="600" y="566" width="392" height="24" rx="12" fill="#D2E3FC"/>
  <text x="610" y="584" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#174EA6">AI ORGANISES · HUMAN DECIDES</text>
  <text x="1130" y="342" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5F6368">AFTER</text>
  <rect x="1130" y="370" width="350" height="238" rx="22" fill="#E6F4EA"/>
  <text x="1164" y="420" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#137333">Decision-ready state</text>
  <text x="1164" y="472" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#3C4043">Facts are visible</text>
  <text x="1164" y="510" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#3C4043">Unknowns stay visible</text>
  <text x="1164" y="548" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#3C4043">Next questions are explicit</text>
  <text x="1164" y="586" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#137333">Human makes the decision</text>
  <line x1="470" y1="489" x2="565" y2="489" stroke="#9AA0A6" stroke-width="4"/><polygon points="565,489 548,480 548,498" fill="#9AA0A6"/>
  <line x1="1035" y1="489" x2="1130" y2="489" stroke="#9AA0A6" stroke-width="4"/><polygon points="1130,489 1113,480 1113,498" fill="#9AA0A6"/>
  <rect x="120" y="658" width="1360" height="124" rx="20" fill="#F8F9FA" stroke="#E0E0DC"/>
  <text x="150" y="703" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202124">DEMONSTRATES</text>
  <text x="150" y="741" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3C4043">Workflow diagnosis · evidence / unknown handling · Human decision boundary</text>
  <text x="860" y="703" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202124">DOES NOT ESTABLISH</text>
  <text x="860" y="741" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3C4043">No live integration · client deployment · measured ROI</text>
</svg>